<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nova Página</title>
</head>
<body>

<form method="POST" enctype="multipart/form-data">

    <h2>Nova Página 🌻</h2>

    <p>Título</p>

    <input
        type="text"
        name="titulo"
        required>

    <br><br>

    <p>Texto</p>

    <textarea
        name="texto"
        rows="8"
        cols="60"
        required></textarea>

    <br><br>

    <p>Imagem</p>

    <input
        type="file"
        name="imagem">

    <br><br>

    <button type="submit">
        Salvar Página
    </button>

</form>

</body>
</html>
