<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Nova Página</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/nova.css') }}">

</head>

<body>

<div class="container">

    <h1>🌻 Nova Página do Livro</h1>

    <form
    action="/nova"
    method="POST"
    enctype="multipart/form-data">

        <label>Título</label>

        <input
        type="text"
        name="titulo"
        required>

        <label>Texto</label>

        <textarea
        name="texto"
        rows="8"
        required></textarea>

        <label>Imagem</label>

        <input
        type="file"
        name="imagem"
        id="imagem"
        accept="image/*">

        <img
        id="preview"
        src="#"
        style="display:none;">

        <div class="botoes">

            <a href="/banco">

                Voltar

            </a>

            <button type="submit">

                💾 Salvar Página

            </button>

        </div>

    </form>

</div>

<script>

const input=document.getElementById("imagem");
const preview=document.getElementById("preview");

input.onchange=e=>{

    const file=e.target.files[0];

    if(!file)return;

    preview.src=URL.createObjectURL(file);

    preview.style.display="block";

}

</script>

</body>
</html>
