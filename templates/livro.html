<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Livro da Maria</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/livro.css') }}">

</head>

<body>

<div class="scene">

<div class="book" id="book">

<div class="cover" id="cover">

<img src="{{ url_for('static',
filename='img/livro/book.png') }}">

</div>

<div class="pages">

{% for pagina in paginas %}

<div class="paper"
id="p{{ loop.index }}">

<div class="front">

<div class="content">

<h1>

{{ pagina[1] }}

</h1>

{% if pagina[3] != "" %}

<img
class="foto-pagina"
src="{{ url_for('static',
filename='img/uploads/' + pagina[3]) }}">

{% endif %}

<p>

{{ pagina[2] }}

</p>

</div>

</div>

<div class="back"></div>

</div>

{% endfor %}

</div>

</div>

</div>

<div class="controls">

<button id="prev">

◀

</button>

<span id="contador">

1 / {{ paginas|length }}

</span>

<button id="next">

▶

</button>

</div>

<script>

const TOTAL_PAGINAS =
{{ paginas|length }};

</script>

<script src="{{ url_for('static',
filename='js/livro.js') }}"></script>

</body>

</html>
