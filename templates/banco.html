<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Banco da Maria</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/banco.css') }}">

</head>

<body>

<div class="container">

    <h1>📚 Banco da Maria</h1>

    <a href="/nova" class="novo">

        ➕ Nova Página

    </a>

    {% if paginas|length == 0 %}

        <div class="vazio">

            Nenhuma página cadastrada.

        </div>

    {% else %}

    <div class="grid">

    {% for pagina in paginas %}

        <div class="card">

            {% if pagina[3] != "" %}

            <img
            src="{{ url_for('static', filename='img/uploads/' + pagina[3]) }}">

            {% endif %}

            <h2>

                {{ pagina[1] }}

            </h2>

            <p>

                {{ pagina[2][:120] }}...

            </p>

            <div class="acoes">

                <a
                class="editar"
                href="/editar/{{ pagina[0] }}">

                ✏️ Editar

                </a>

                <a
                class="excluir"
                href="/excluir/{{ pagina[0] }}">

                🗑️ Excluir

                </a>

            </div>

        </div>

    {% endfor %}

    </div>

    {% endif %}

</div>

</body>

</html>
