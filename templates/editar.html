<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<title>Editar</title>

<style>

body{

font-family:Arial;
background:#f5f5f5;
padding:40px;

}

input,
textarea{

width:100%;
padding:10px;
margin-top:10px;
margin-bottom:20px;

}

button{

padding:12px 25px;
font-size:18px;

}

</style>

</head>
<body>

<h1>Editar Página 🌻</h1>

<form method="POST">

Título

<input
type="text"
name="titulo"
value="{{ pagina[1] }}">

Texto

<textarea
name="texto"
rows="8">{{ pagina[2] }}</textarea>

<button>

Salvar Alterações

</button>

</form>

</body>
</html>
